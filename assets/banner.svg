<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05010a"/>
      <stop offset="50%" stop-color="#0f0221"/>
      <stop offset="100%" stop-color="#05010a"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#FF00E5"/>
      <stop offset="100%" stop-color="#00F5FF"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="260" fill="url(#bg)"/>

  <!-- scanlines -->
  <g opacity="0.12">
    <rect x="0" y="0" width="1000" height="260" fill="url(#scan)"/>
  </g>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="2" fill="#00F5FF"/>
  </pattern>

  <!-- glitch title, three offset copies for RGB-split flicker -->
  <g filter="url(#glow)">
    <text x="500" y="115" text-anchor="middle" font-family="Courier New, monospace" font-weight="700" font-size="58" fill="#FF00E5" opacity="0.65">
      MIKESTH3TIC.DEV
      <animate attributeName="x" values="500;496;503;500" dur="2.4s" repeatCount="indefinite"/>
    </text>
    <text x="500" y="115" text-anchor="middle" font-family="Courier New, monospace" font-weight="700" font-size="58" fill="#00F5FF" opacity="0.65">
      MIKESTH3TIC.DEV
      <animate attributeName="x" values="500;504;497;500" dur="2.4s" repeatCount="indefinite"/>
    </text>
    <text x="500" y="115" text-anchor="middle" font-family="Courier New, monospace" font-weight="700" font-size="58" fill="url(#neon)">
      MIKESTH3TIC.DEV
    </text>
  </g>

  <text x="500" y="160" text-anchor="middle" font-family="Courier New, monospace" font-size="22" fill="#c9d1ff" letter-spacing="4">
    DISRUPT. AUTOMATE. DOMINATE.
    <animate attributeName="opacity" values="1;0.4;1" dur="3.2s" repeatCount="indefinite"/>
  </text>

  <text x="500" y="200" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="#7dffef" opacity="0.85">
    Michael Ogutu Mokua · Nairobi, Kenya 🇰🇪
  </text>

  <!-- corner brackets, cyberpunk HUD framing -->
  <g stroke="#00F5FF" stroke-width="2" fill="none" opacity="0.8">
    <polyline points="20,20 20,55 55,55"/>
    <polyline points="980,20 980,55 945,55"/>
    <polyline points="20,240 20,205 55,205"/>
    <polyline points="980,240 980,205 945,205"/>
  </g>
</svg>
